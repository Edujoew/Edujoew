name: 🐍 Neon Snake

on:
  schedule:
    - cron: "17 */8 * * *"       # every 8 hours, offset to avoid the top-of-hour rush
  workflow_dispatch:              # manual run button in the Actions tab
  push:
    branches: [main, master]

# Only one build at a time; a newer run cancels an older one
concurrency:
  group: neon-snake
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-snake:
    name: Generate & publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 🧬 Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?palette=github-dark&color_snake=#00C9FF&color_dots=#161b22,#2d1b69,#4c1fa8,#6C2BD9,#FF4B6E
            dist/snake-light.svg?color_snake=#6C2BD9&color_dots=#ebedf0,#d9ccf5,#b79bec,#8f5fe0,#6C2BD9

      - name: 🚀 Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh neon snake"
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
